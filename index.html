<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes deals</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f3f4f6; --card: #fff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #e8590c; --price: #0f7b3f; --hot: #d9480f; --hot-bg: #fff1e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316; --card: #1b1e23; --text: #eceef1; --muted: #9aa1ac; --line: #2b2f36;
      --accent: #ff8a4c; --price: #4ade80; --hot: #ff9d6b; --hot-bg: #3a2416;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 820px; margin: 0 auto; padding: 10px 16px 0; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 18px; }
  #updated { color: var(--muted); font-size: 12px; }
  nav { display: flex; gap: 4px; margin-top: 8px; }
  nav button { flex: none; padding: 8px 12px; border: 0; border-bottom: 3px solid transparent;
    background: none; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
  main { max-width: 820px; margin: 0 auto; padding: 12px 16px 80px; }
  .deal { display: flex; gap: 12px; align-items: stretch; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .deal img { flex: none; width: 92px; height: 92px; object-fit: contain; border-radius: 6px; background: #fff; }
  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 12px; align-items: center; }
  .temp { color: var(--hot); background: var(--hot-bg); font-weight: 700; padding: 1px 7px; border-radius: 99px; }
  .deal a.title { color: inherit; text-decoration: none; font-weight: 600; overflow-wrap: anywhere; }
  .deal a.title:hover { text-decoration: underline; }
  .deal a.title:visited { color: var(--muted); }
  .price { color: var(--price); font-weight: 700; font-size: 16px; }
  .hide { flex: none; align-self: center; min-width: 44px; min-height: 44px; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--muted);
    font: inherit; font-size: 13px; cursor: pointer; }
  .hide:hover { color: var(--text); border-color: var(--muted); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 14px;
    align-items: center; background: #16181d; color: #fff; padding: 10px 14px; border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.3); font-size: 14px; }
  #toast[hidden] { display: none; }
  #toast button { border: 0; background: none; color: #ffb08a; font: inherit; font-weight: 700; cursor: pointer; padding: 4px; }
  @media (max-width: 520px) {
    .deal img { width: 72px; height: 72px; }
    .hide .label { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="top">
      <h1>Mes deals</h1>
      <span id="updated"></span>
    </div>
    <nav role="tablist">
      <button role="tab" data-tab="hot">Tendance</button>
      <button role="tab" data-tab="new">Nouveaux</button>
      <button role="tab" data-tab="hidden">Cachés <span id="hiddenCount"></span></button>
    </nav>
  </div>
</header>
<main id="list" aria-live="polite"></main>
<div id="toast" role="status" hidden><span>Deal caché</span><button id="undo">Annuler</button></div>

<script>
const STORE = 'dealsCaches';      // { idDuDeal: dateDuMasquage }
const KEEP_DAYS = 120;            // on oublie un deal caché disparu de Dealabs depuis longtemps
const REFRESH_MS = 5 * 60 * 1000;

const $ = (id) => document.getElementById(id);
let deals = [], updated = null, lastHidden = null, toastTimer;
let tab = ['hot', 'new', 'hidden'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'hot';

function loadHidden() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; }
}
function saveHidden() {
  try { localStorage.setItem(STORE, JSON.stringify(hidden)); } catch {}
}
let hidden = loadHidden();

function ago(iso) {
  const min = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
  if (min < 1) return "à l'instant";
  if (min < 60) return `il y a ${min} min`;
  if (min < 1440) return `il y a ${Math.floor(min / 60)} h`;
  return `il y a ${Math.floor(min / 1440)} j`;
}

function el(tagName, props = {}, ...children) {
  const node = Object.assign(document.createElement(tagName), props);
  node.append(...children.filter(Boolean));
  return node;
}

function card(d) {
  const isHidden = d.id in hidden;
  const when = (tab === 'hot' && d.hotDate) || d.date || d.hotDate;
  const btn = el('button', { className: 'hide', title: isHidden ? 'Réafficher ce deal' : 'Cacher ce deal' },
    isHidden ? '↩ ' : '✕ ', el('span', { className: 'label' }, isHidden ? 'Réafficher' : 'Cacher'));
  btn.setAttribute('aria-label', (isHidden ? 'Réafficher : ' : 'Cacher : ') + d.title);
  btn.onclick = () => toggle(d.id);
  return el('article', { className: 'deal' },
    d.image && el('img', { src: d.image, alt: '', loading: 'lazy', width: 92, height: 92 }),
    el('div', { className: 'body' },
      el('div', { className: 'meta' },
        d.temp != null && el('span', { className: 'temp' }, d.temp + '°'),
        d.merchant && el('span', {}, d.merchant),
        d.category && el('span', {}, d.category),
        el('span', {}, ago(when))),
      el('a', { className: 'title', href: d.link, target: '_blank', rel: 'noopener', textContent: d.title }),
      d.price && el('div', { className: 'price' }, d.price)),
    btn);
}

function render() {
  for (const b of document.querySelectorAll('nav button')) b.setAttribute('aria-selected', b.dataset.tab === tab);
  const n = deals.filter((d) => d.id in hidden).length;
  $('hiddenCount').textContent = n ? `(${n})` : '';
  $('updated').textContent = updated ? 'Mis à jour ' + ago(updated) : '';

  let rows;
  if (tab === 'hidden') {
    rows = deals.filter((d) => d.id in hidden).sort((a, b) => hidden[b.id] - hidden[a.id]);
  } else if (tab === 'hot') {
    rows = deals.filter((d) => d.hotDate && !(d.id in hidden))
      .sort((a, b) => Date.parse(b.hotDate) - Date.parse(a.hotDate));
  } else {
    rows = deals.filter((d) => d.date && !(d.id in hidden)).sort((a, b) => Date.parse(b.date) - Date.parse(a.date));
  }
  const empty = !deals.length ? 'Chargement…'
    : tab === 'hidden' ? 'Aucun deal caché.' : 'Plus rien à voir ici : tout est caché ou déjà vu.';
  $('list').replaceChildren(...(rows.length ? rows.map(card) : [el('p', { className: 'empty' }, empty)]));
}

function toggle(id) {
  if (id in hidden) {
    delete hidden[id];
    $('toast').hidden = true;
  } else {
    hidden[id] = Date.now();
    lastHidden = id;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; }, 5000);
  }
  saveHidden();
  render();
}

async function refresh() {
  try {
    const res = await fetch('deals.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    deals = data.deals;
    updated = data.updated;
    // Ménage : oublier les deals cachés qui ne sont plus dans la liste depuis longtemps.
    const present = new Set(deals.map((d) => d.id));
    const limit = Date.now() - KEEP_DAYS * 864e5;
    for (const id in hidden) if (!present.has(id) && hidden[id] < limit) delete hidden[id];
    saveHidden();
  } catch (e) {
    if (!deals.length) { $('list').replaceChildren(el('p', { className: 'empty' }, 'Impossible de charger les deals.')); return; }
  }
  render();
}

function setTab(name) {
  if (!['hot', 'new', 'hidden'].includes(name)) return;
  tab = name;
  window.scrollTo(0, 0);
  render();
}
document.querySelector('nav').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  history.replaceState(null, '', '#' + b.dataset.tab);
  setTab(b.dataset.tab);
};
window.addEventListener('hashchange', () => setTab(location.hash.slice(1)));
$('undo').onclick = () => { if (lastHidden) toggle(lastHidden); };
// Si on cache un deal dans un autre onglet du navigateur, cette page suit.
window.addEventListener('storage', (e) => { if (e.key === STORE) { hidden = loadHidden(); render(); } });

render();
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
